<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="i18n" data-ar="العهد كولنج سنتر" data-en="Al Ahad Cooling Center">العهد كولنج سنتر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary: #0A2540; --cyan: #00D4FF; --gold: #FFD700; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: #f4f7fa; }
        
        /* Language Switcher */
        .lang-btn { position: fixed; top: 10px; left: 10px; z-index: 2000; padding: 8px 15px; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 5px; }

        /* Animation class */
        .animate-box { animation: fadeInUp 1s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Image Gallery Styling */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 50px 5%; }
        .img-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .img-card img { width: 100%; border-radius: 10px; }
        .caption { text-align: center; font-weight: bold; margin-top: 10px; color: var(--primary); }

        /* Review Section */
        .reviews { padding: 50px 5%; background: var(--primary); color: white; text-align: center; }
        .stats { display: flex; justify-content: center; gap: 50px; margin-top: 30px; }
        .stat-box { font-size: 24px; font-weight: bold; color: var(--gold); }
    </style>
</head>
<body>

    <button class="lang-btn" onclick="toggleLang()">English / العربية</button>

    <!-- Header Section -->
    <header class="animate-box" style="text-align: center; padding: 50px; background: white;">
        <h1 class="i18n" data-ar="مرحباً بكم في العهد كولنج سنتر" data-en="Welcome to Al Ahad Cooling Center">مرحباً بكم في العهد كولنج سنتر</h1>
    </header>

    <!-- Images Section -->
    <section class="gallery-grid">
        <div class="img-card animate-box"><img src="1000350039.webp"><p class="caption">فحص فني دقيق</p></div>
        <div class="img-card animate-box"><img src="1000350027.png"><p class="caption">تنظيف احترافي للمكيفات</p></div>
        <div class="img-card animate-box"><img src="1000350035.jpg"><p class="caption">صيانة المكونات الكهربائية</p></div>
        <div class="img-card animate-box"><img src="1000350033.jpg"><p class="caption">صيانة المكيفات الخارجية</p></div>
    </section>

    <!-- Reviews & Stats Section -->
    <section class="reviews">
        <h2 class="i18n" data-ar="ماذا يقول عملاؤنا" data-en="What our clients say">ماذا يقول عملاؤنا</h2>
        <div class="stats">
            <div><div class="stat-box">1.1K+</div><p>Client Reviews</p></div>
            <div><div class="stat-box">1 Million+</div><p>Satisfied Customers</p></div>
        </div>
    </section>

    <script>
        function toggleLang() {
            const html = document.getElementById('htmlTag');
            const lang = html.getAttribute('dir') === 'rtl' ? 'en' : 'ar';
            html.setAttribute('dir', lang === 'rtl' ? 'rtl' : 'ltr');
            html.setAttribute('lang', lang);
            document.querySelectorAll('.i18n').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
        }
    </script>
</body>
</html>
